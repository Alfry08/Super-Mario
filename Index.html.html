<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Super Mario Web - Single File</title>
<style>
body {
  margin: 0;
  overflow: hidden;
  background: #5c94fc;
  font-family: Arial, sans-serif;
}

canvas {
  display: block;
  margin: auto;
  background: #5c94fc;
}

#controls {
  position: fixed;
  bottom: 20px;
  width: 100%;
  display: flex;
  justify-content: space-around;
}

button {
  width: 80px;
  height: 80px;
  font-size: 30px;
  border-radius: 50%;
  border: none;
  background: #fff;
  opacity: 0.85;
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="controls">
  <button id="left">◀</button>
  <button id="jump">▲</button>
  <button id="right">▶</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let gravity = 0.6;

// PLAYER
const player = {
  x: 100,
  y: 200,
  w: 40,
  h: 40,
  vx: 0,
  vy: 0,
  speed: 5,
  jumping: false
};

// PLATFORMS
const platforms = [
  { x: 0, y: canvas.height - 40, w: canvas.width, h: 40 },
  { x: 250, y: 420, w: 160, h: 20 },
  { x: 520, y: 340, w: 160, h: 20 }
];

// ENEMY
const enemy = {
  x: 500,
  y: canvas.height - 80,
  w: 40,
  h: 40,
  vx: 2
};

let left = false;
let right = false;

// TOUCH CONTROLS
document.getElementById("left").ontouchstart = () => left = true;
document.getElementById("left").ontouchend = () => left = false;

document.getElementById("right").ontouchstart = () => right = true;
document.getElementById("right").ontouchend = () => right = false;

document.getElementById("jump").ontouchstart = () => {
  if (!player.jumping) {
    player.vy = -12;
    player.jumping = true;
  }
};

function collision(a, b) {
  return (
    a.x < b.x + b.w &&
    a.x + a.w > b.x &&
    a.y < b.y + b.h &&
    a.y + a.h > b.y
  );
}

function update() {
  player.vx = 0;
  if (left) player.vx = -player.speed;
  if (right) player.vx = player.speed;

  player.vy += gravity;
  player.x += player.vx;
  player.y += player.vy;

  platforms.forEach(p => {
    if (collision(player, p) && player.vy >= 0) {
      player.y = p.y - player.h;
      player.vy = 0;
      player.jumping = false;
    }
  });

  enemy.x += enemy.vx;
  if (enemy.x <= 0 || enemy.x + enemy.w >= canvas.width) {
    enemy.vx *= -1;
  }

  if (collision(player, enemy)) {
    alert("Game Over 💀");
    location.reload();
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "red";
  ctx.fillRect(player.x, player.y, player.w, player.h);

  ctx.fillStyle = "green";
  platforms.forEach(p => ctx.fillRect(p.x, p.y, p.w, p.h));

  ctx.fillStyle = "brown";
  ctx.fillRect(enemy.x, enemy.y, enemy.w, enemy.h);
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
